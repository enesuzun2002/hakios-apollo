# What the scripts at the top need to know about the Mi 10T (mkxnuimg.py reads it: plain NAME=value
# lines, no expansions; the shell can source it too).
#
# UEFI_TARGET   the Mu-Silicium device name: Build/apolloPkg, Resources/DTBs/apollo.dtb
# MU            the Mu-Silicium tree this port is built in (uefi/apply.sh), apart from the POCO's
# FD_BASE       where the boot shim copies the UEFI firmware volume, and its exact size: XBL's UEFI
# FD_SIZE       window in the phone's uefiplatLA.cfg (uefi/files/Resources/Configs/apollo.toml)
# PAYLOAD_BASE  where the boot shim copies the XNUP payload: free DDR in the XBL memory map
#               (uefi/files/Platforms/Xiaomi/apolloPkg/Library/MemoryMapLib/MemoryMapLib.c)
UEFI_TARGET=apollo
MU=Mu-Silicium-apollo
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000
